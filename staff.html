<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr Spin Laundry — Staff Portal</title>
<script src="store.js"></script>
<style>
  :root{ --y:#FFC400; --yl:#fff7d6; --ink:#1a1a1a; --gray:#8a8577; --line:#eee9d8; --bg:#faf7ef; --dark:#111; }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;background:#e0dbc8;}
  body{display:flex;justify-content:center;}
  #app{width:100%;max-width:440px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 50px rgba(0,0,0,.22);font-size:14px;position:relative;}
  .hide{display:none!important;}

  /* LOGIN */
  .login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:30px 24px;background:linear-gradient(160deg,#111 0%,#222 55%,#1a1a1a 100%);color:#fff;min-height:100vh;}
  .login .logo{width:64px;height:64px;border-radius:16px;object-fit:cover;margin:0 auto 14px;display:block;box-shadow:0 6px 20px rgba(0,0,0,.4);}
  .login h1{text-align:center;font-size:20px;font-weight:800;color:var(--y);}
  .login .sub{text-align:center;font-size:12px;color:#aaa;margin:4px 0 26px;}
  .login label{font-size:12px;font-weight:700;color:#ccc;display:block;margin-bottom:6px;}
  .login input,.login select{width:100%;background:#2b2b2b;border:1.5px solid #3a3a3a;border-radius:12px;padding:13px 14px;font-size:14px;color:#fff;margin-bottom:14px;}
  .login input:focus,.login select:focus{outline:none;border-color:var(--y);}
  .login .btn{width:100%;background:var(--y);color:#111;border:none;padding:14px;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;margin-top:6px;}
  .login .btn:active{transform:scale(.98);}
  .login .hint{margin-top:20px;background:#00000033;border-radius:12px;padding:12px 14px;font-size:11px;color:#bbb;line-height:1.7;}
  .login .hint b{color:var(--y);}

  /* TOPBAR */
  .topbar{background:var(--y);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;}
  .topbar .who{font-size:15px;font-weight:800;color:#111;}
  .topbar .role{font-size:10px;font-weight:800;opacity:.65;letter-spacing:.5px;}
  .topbar .out{background:rgba(0,0,0,.12);border:none;border-radius:20px;padding:7px 12px;font-size:11px;font-weight:800;cursor:pointer;color:#111;}
  .tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);}
  .tab{flex:1;text-align:center;padding:11px 4px;font-size:12px;font-weight:700;color:var(--gray);cursor:pointer;border-bottom:3px solid transparent;}
  .tab.on{color:#111;border-color:var(--y);}
  .body{padding:14px;overflow-y:auto;flex:1;padding-bottom:24px;}

  /* CARDS shared */
  .card{background:#fff;border-radius:14px;padding:13px;border:1.5px solid var(--line);margin-bottom:10px;}
  .card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .card .oid{font-weight:800;font-size:13px;}
  .badge{font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;background:var(--yl);color:#8a6d00;}
  .badge.pickup{background:#ffe4b8;color:#a35a00;}
  .badge.deliver{background:#d7f0e0;color:#0d7a45;}
  .card .addr{font-size:12px;color:var(--gray);margin:2px 0;}
  .card .cust{font-size:12.5px;font-weight:700;margin-top:4px;}
  .btnrow{display:flex;gap:8px;margin-top:10px;}
  .btn{flex:1;padding:10px;border-radius:10px;border:none;font-weight:800;font-size:12.5px;cursor:pointer;}
  .btn.primary{background:#111;color:var(--y);}
  .btn.ghost{background:var(--yl);color:#8a6d00;}
  .empty{text-align:center;color:var(--gray);padding:40px 10px;font-size:13px;}
  .photobox{width:100%;height:80px;border-radius:10px;background:repeating-linear-gradient(45deg,#f0ede0,#f0ede0 10px,#e8e4d4 10px,#e8e4d4 20px);display:flex;align-items:center;justify-content:center;font-size:24px;margin-top:8px;color:#8a8577;}

  /* OUTLET kanban */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .col{background:#fff;border-radius:12px;border:1.5px solid var(--line);min-height:120px;}
  .col h3{padding:9px 11px;font-size:11.5px;font-weight:800;border-bottom:1.5px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .col h3 .cnt{background:var(--yl);color:#8a6d00;font-size:10px;padding:2px 7px;border-radius:10px;}
  .colbody{padding:8px;display:flex;flex-direction:column;gap:7px;}
  .mini{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;}
  .mini .oid{font-weight:800;font-size:11.5px;} .mini .cust{font-size:10.5px;color:var(--gray);margin-top:1px;}
  .mini .svc{font-size:10px;color:#555;margin-top:3px;}
  .mini button{margin-top:6px;width:100%;background:#111;color:var(--y);border:none;padding:6px;border-radius:7px;font-size:10.5px;font-weight:800;cursor:pointer;}
  .mini .emptc{color:var(--gray);font-size:11px;text-align:center;padding:16px 4px;}

  /* MONITOR */
  #app.monitormode{max-width:100%;background:#0a0a0a;}
  .mon{background:#0a0a0a;color:#fff;min-height:100vh;display:flex;flex-direction:column;}
  .monhead{display:flex;justify-content:space-between;align-items:center;padding:18px 30px;background:linear-gradient(90deg,#111,#1a1a1a);border-bottom:3px solid var(--y);}
  .monhead .brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800;color:var(--y);}
  .monhead .clock{font-size:20px;font-weight:700;color:#eee;font-family:monospace;}
  .monhead .exit{background:#222;color:#ccc;border:1px solid #333;border-radius:20px;padding:8px 14px;font-size:12px;cursor:pointer;}
  .monwrap{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:24px 30px;flex:1;}
  @media(max-width:700px){ .monwrap{grid-template-columns:1fr;} }
  .panel{background:#141414;border-radius:18px;border:2px solid #262626;overflow:hidden;}
  .panel.pickup{border-color:#5a3d00;} .panel.deliver{border-color:#00432a;}
  .panel h2{padding:16px 22px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px;}
  .panel.pickup h2{background:#241a00;color:#ffb700;} .panel.deliver h2{background:#00220f;color:#3ddc84;}
  .rows{padding:12px;display:flex;flex-direction:column;gap:10px;max-height:66vh;overflow-y:auto;}
  .mrow{background:#1e1e1e;border-radius:12px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;animation:pop .4s ease;border-left:5px solid var(--y);}
  .panel.deliver .mrow{border-left-color:#3ddc84;}
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  .mrow .oid{font-size:17px;font-weight:800;} .mrow .meta{font-size:12px;color:#999;margin-top:4px;}
  .mrow .agebadge{font-size:12px;font-weight:800;padding:6px 13px;border-radius:20px;background:#ffb70022;color:#ffb700;}
  .panel.deliver .mrow .agebadge{background:#3ddc8422;color:#3ddc84;}
  .mrow.urgent .agebadge{background:#ff4d4d33;color:#ff6b6b;animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:.4}}
  .monempty{text-align:center;color:#555;padding:44px 20px;font-size:14px;}
  .flash{position:fixed;inset:0;background:var(--y);opacity:0;pointer-events:none;transition:opacity .15s;z-index:50;}
  .flash.on{opacity:.15;}

  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#111;color:var(--y);padding:10px 18px;border-radius:30px;font-size:12px;font-weight:700;z-index:99;box-shadow:0 6px 18px rgba(0,0,0,.3);display:none;}
</style>
</head>
<body>
<div class="flash" id="flash"></div>
<div id="app">

  <!-- LOGIN -->
  <div class="login" id="loginScreen">
    <img src="logo.jpg" class="logo" alt="logo" onerror="this.style.display='none'">
    <h1>Mr Spin — Staff Portal</h1>
    <div class="sub">Login karyawan (Driver / Operator Outlet / Monitor)</div>
    <label>Username Karyawan</label>
    <input id="loginUser" placeholder="mis. budi / sari / monitor" autocomplete="off">
    <label>Password</label>
    <input id="loginPass" type="password" placeholder="••••••" autocomplete="off">
    <label>Login Sebagai</label>
    <select id="loginRole">
      <option value="driver">🚗 Driver / Kurir</option>
      <option value="operator">🏪 Operator Outlet</option>
      <option value="monitor">📺 Monitor Display</option>
    </select>
    <button class="btn" onclick="doLogin()">Masuk</button>
    <div class="hint">
      <b>Akun demo:</b><br>
      Driver → <b>budi</b> / 123<br>
      Operator → <b>sari</b> / 123<br>
      Monitor → <b>monitor</b> / 123
    </div>
  </div>

  <!-- APP SHELL (after login) -->
  <div id="shell" class="hide" style="flex:1;display:flex;flex-direction:column;">
    <div class="topbar" id="topbar">
      <div><div class="who" id="whoName">-</div><div class="role" id="whoRole">-</div></div>
      <button class="out" onclick="doLogout()">Keluar ⏻</button>
    </div>
    <div class="tabs hide" id="driverTabs">
      <div class="tab on" data-dtab="pickup" onclick="setDriverTab('pickup')">Jemput Baru</div>
      <div class="tab" data-dtab="deliver" onclick="setDriverTab('deliver')">Antar Balik</div>
    </div>
    <div class="body" id="shellBody"></div>
  </div>

  <!-- MONITOR MODE (full) -->
  <div class="mon hide" id="monScreen">
    <div class="monhead">
      <div class="brand">🌀 MR SPIN <span style="font-size:13px;color:#999;font-weight:600;margin-left:6px" id="monOutlet">Outlet</span></div>
      <div style="display:flex;align-items:center;gap:16px"><div class="clock" id="monClock">00:00:00</div><button class="exit" onclick="doLogout()">Keluar</button></div>
    </div>
    <div class="monwrap">
      <div class="panel pickup"><h2>📦 PERLU DIJEMPUT</h2><div class="rows" id="monPickup"></div></div>
      <div class="panel deliver"><h2>🚚 SIAP DIANTAR</h2><div class="rows" id="monDeliver"></div></div>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
const STAFF = {
  budi:   {pass:'123', name:'Budi Santoso', role:'driver'},
  agus:   {pass:'123', name:'Agus Pratama', role:'driver'},
  sari:   {pass:'123', name:'Sari Wulan',   role:'operator'},
  dewi:   {pass:'123', name:'Dewi Lestari', role:'operator'},
  monitor:{pass:'123', name:'Monitor Outlet', role:'monitor'}
};
const OUTLET_NAME = 'Outlet Merdeka';
let session = null;
let driverTab = 'pickup';

function esc(s){ return String(s||'').replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function fmt(f){ return String(f).replace('.', ','); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',1700); }
function timeAgo(ts){ const m=Math.floor((Date.now()-ts)/60000); return m<1?'baru saja':m+' menit lalu'; }

/* ---------- AUTH ---------- */
function doLogin(){
  const u = document.getElementById('loginUser').value.trim().toLowerCase();
  const p = document.getElementById('loginPass').value.trim();
  if(!u || !p){ showToast('Isi username & password dulu'); return; }
  const acc = STAFF[u];
  if(!acc || acc.pass !== p){ showToast('Username / password salah'); return; }
  // Role otomatis dari akun (dropdown cuma info, gak wajib cocok)
  session = {user:u, name:acc.name, role:acc.role};
  try{ localStorage.setItem('mrspin_staff', JSON.stringify(session)); }catch(e){}
  enterApp();
}
function doLogout(){
  session = null;
  try{ localStorage.removeItem('mrspin_staff'); }catch(e){}
  document.getElementById('app').classList.remove('monitormode');
  document.getElementById('monScreen').classList.add('hide');
  document.getElementById('shell').classList.add('hide');
  document.getElementById('loginScreen').classList.remove('hide');
  document.getElementById('loginUser').value='';
  document.getElementById('loginPass').value='';
}
function roleLabel(r){ return r==='driver'?'Driver / Kurir':r==='operator'?'Operator Outlet':'Monitor Display'; }

function enterApp(){
  document.getElementById('loginScreen').classList.add('hide');
  if(session.role === 'monitor'){
    document.getElementById('app').classList.add('monitormode');
    document.getElementById('shell').classList.add('hide');
    document.getElementById('monScreen').classList.remove('hide');
    document.getElementById('monOutlet').textContent = OUTLET_NAME;
    renderMonitor();
    return;
  }
  document.getElementById('shell').classList.remove('hide');
  document.getElementById('whoName').textContent = session.name;
  document.getElementById('whoRole').textContent = roleLabel(session.role).toUpperCase() + ' • ' + OUTLET_NAME;
  if(session.role === 'driver'){
    document.getElementById('driverTabs').classList.remove('hide');
    renderDriver();
  } else {
    document.getElementById('driverTabs').classList.add('hide');
    renderOperator();
  }
}

/* ---------- DRIVER ---------- */
function setDriverTab(t){ driverTab=t; document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('on', el.dataset.dtab===t)); renderDriver(); }
function renderDriver(){
  const el = document.getElementById('shellBody');
  const all = Store.getAll();
  const items = driverTab==='pickup' ? all.filter(o=>o.status==='menunggu_pickup') : all.filter(o=>o.status==='siap_kirim');
  if(!items.length){ el.innerHTML = `<div class="empty">${driverTab==='pickup'?'Belum ada order baru untuk dijemput':'Belum ada cucian siap diantar'}</div>`; return; }
  el.innerHTML = items.map(o=>{
    if(driverTab==='pickup'){
      return `<div class="card">
        <div class="top"><div class="oid">#${o.id}</div><div class="badge pickup">Jemput ${timeAgo(o.createdAt)}</div></div>
        <div class="cust">${esc(o.customer)} • ${esc(o.phone)}</div>
        <div class="addr">📦 ${esc(o.pickupAddr)}</div>
        <div class="addr">${esc(o.service)} • ${esc(o.outlet||'')}</div>
        <div class="photobox" id="pf-${o.id}">${o.proofPickup?'✅ Foto tersimpan':'📸 Ambil foto bukti pickup'}</div>
        <div class="btnrow">
          <button class="btn ghost" onclick="takePhoto('${o.id}','pickup')">📷 Foto Bukti</button>
          <button class="btn primary" onclick="doPickup('${o.id}')">✓ Sudah Dijemput</button>
        </div></div>`;
    }
    return `<div class="card">
      <div class="top"><div class="oid">#${o.id}</div><div class="badge deliver">Siap Diantar</div></div>
      <div class="cust">${esc(o.customer)} • ${esc(o.phone)}</div>
      <div class="addr">🏠 ${esc(o.deliverAddr)}</div>
      <div class="addr">${esc(o.service)} • ${esc(o.outlet||'')}</div>
      <div class="photobox" id="pf-${o.id}">${o.proofDeliver?'✅ Foto tersimpan':'📸 Ambil foto bukti antar'}</div>
      <div class="btnrow">
        <button class="btn ghost" onclick="takePhoto('${o.id}','deliver')">📷 Foto Bukti</button>
        <button class="btn primary" onclick="doDeliver('${o.id}')">✓ Sudah Diantar</button>
      </div></div>`;
  }).join('');
}
function takePhoto(id,kind){ Store.update(id, kind==='pickup'?{proofPickup:true}:{proofDeliver:true}); showToast('Foto bukti berhasil diupload'); }
function doPickup(id){ const o=Store.find(id); if(!o.proofPickup){ showToast('Wajib foto bukti dulu sebelum konfirmasi'); return; } Store.update(id,{status:'dijemput'}); showToast('Ditandai sudah dijemput → outlet dinotif'); renderDriver(); }
function doDeliver(id){ const o=Store.find(id); if(!o.proofDeliver){ showToast('Wajib foto bukti antar dulu'); return; } Store.update(id,{status:'selesai'}); showToast('Pesanan selesai diantar'); renderDriver(); }

/* ---------- OPERATOR ---------- */
function renderOperator(){
  const el = document.getElementById('shellBody');
  el.innerHTML = `<div class="cols">
    <div class="col"><h3>Menunggu Jemput <span class="cnt" id="c1">0</span></h3><div class="colbody" id="col1"></div></div>
    <div class="col"><h3>Masuk Outlet <span class="cnt" id="c2">0</span></h3><div class="colbody" id="col2"></div></div>
    <div class="col"><h3>Sedang Dicuci <span class="cnt" id="c3">0</span></h3><div class="colbody" id="col3"></div></div>
    <div class="col"><h3>Siap Diantar <span class="cnt" id="c4">0</span></h3><div class="colbody" id="col4"></div></div>
  </div>`;
  fillOperator();
}
function opCard(o, label, action){
  return `<div class="mini"><div class="oid">#${o.id}</div><div class="cust">${esc(o.customer)}</div><div class="svc">${esc(o.service)} • ${fmt(o.weight)}kg</div>${action?`<button onclick="${action}('${o.id}')">${label}</button>`:''}</div>`;
}
function fillOperator(){
  const all = Store.getAll();
  const c1=all.filter(o=>o.status==='menunggu_pickup'), c2=all.filter(o=>o.status==='dijemput'), c3=all.filter(o=>o.status==='proses_cuci'), c4=all.filter(o=>o.status==='siap_kirim');
  const set=(id,v)=>{const e=document.getElementById(id); if(e) e.textContent=v;};
  set('c1',c1.length);set('c2',c2.length);set('c3',c3.length);set('c4',c4.length);
  const put=(id,arr,lbl,act,emp)=>{const e=document.getElementById(id); if(e) e.innerHTML=arr.length?arr.map(o=>opCard(o,lbl,act)).join(''):`<div class="emptc">${emp}</div>`;};
  put('col1',c1,null,null,'Menunggu driver');
  put('col2',c2,'Mulai Cuci →','startWash','Belum ada masuk');
  put('col3',c3,'Selesai →','finishWash','Tidak ada');
  put('col4',c4,null,null,'Menunggu driver antar');
}
function startWash(id){ Store.update(id,{status:'proses_cuci'}); showToast('Order #'+id+' mulai dicuci'); fillOperator(); }
function finishWash(id){ Store.update(id,{status:'siap_kirim'}); showToast('#'+id+' siap dikirim → notif driver & monitor'); fillOperator(); }

/* ---------- MONITOR ---------- */
let lastCount = {p:0,d:0};
function flash(){ const f=document.getElementById('flash'); f.classList.add('on'); setTimeout(()=>f.classList.remove('on'),400); }
function renderMonitor(){
  const all = Store.getAll();
  const pickup = all.filter(o=>o.status==='menunggu_pickup').sort((a,b)=>a.createdAt-b.createdAt);
  const deliver = all.filter(o=>o.status==='siap_kirim').sort((a,b)=>a.createdAt-b.createdAt);
  if(pickup.length>lastCount.p || deliver.length>lastCount.d) flash();
  lastCount = {p:pickup.length, d:deliver.length};
  document.getElementById('monPickup').innerHTML = pickup.length ? pickup.map(o=>{
    const mins=Math.floor((Date.now()-o.createdAt)/60000);
    return `<div class="mrow ${mins>30?'urgent':''}"><div><div class="oid">#${o.id} — ${esc(o.customer)}</div><div class="meta">${esc(o.service)} • ${esc(o.pickupAddr)}</div></div><div class="agebadge">${timeAgo(o.createdAt)}</div></div>`;
  }).join('') : '<div class="monempty">Tidak ada cucian menunggu dijemput</div>';
  document.getElementById('monDeliver').innerHTML = deliver.length ? deliver.map(o=>`<div class="mrow"><div><div class="oid">#${o.id} — ${esc(o.customer)}</div><div class="meta">${esc(o.service)} • ${esc(o.deliverAddr)}</div></div><div class="agebadge">Siap Kirim</div></div>`).join('') : '<div class="monempty">Tidak ada cucian siap diantar</div>';
}
function tickClock(){ const e=document.getElementById('monClock'); if(e) e.textContent = new Date().toLocaleTimeString('id-ID'); }
setInterval(tickClock,1000); tickClock();
setInterval(()=>{ if(session && session.role==='monitor') renderMonitor(); }, 5000);

/* ---------- LIVE REFRESH ---------- */
function refreshCurrent(){
  if(!session) return;
  if(session.role==='driver') renderDriver();
  else if(session.role==='operator') fillOperator();
  else if(session.role==='monitor') renderMonitor();
}

/* ---------- BOOT ---------- */
Store.seed();
Store.subscribe(refreshCurrent);
try{
  const saved = JSON.parse(localStorage.getItem('mrspin_staff')||'null');
  if(saved && STAFF[saved.user]){ session = saved; enterApp(); }
}catch(e){}
