<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mr Spin Laundry — Driver</title>
<script src="store.js"></script>
<style>
  :root{ --y:#FFC400; --yl:#fff7d6; --ink:#1a1a1a; --gray:#8a8577; --line:#eee9d8; --bg:#faf7ef; }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:#e0dbc8;}
  body{display:flex;justify-content:center;}
  #app{width:100%;max-width:390px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 50px rgba(0,0,0,.22);font-size:14px;}
  .topbar{background:var(--y);padding:14px 16px;}
  .topbar .role{font-size:10px;font-weight:800;letter-spacing:.5px;opacity:.7}
  .topbar .ttl{font-size:17px;font-weight:800;color:#111;}
  .tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);}
  .tab{flex:1;text-align:center;padding:11px 4px;font-size:12px;font-weight:700;color:var(--gray);cursor:pointer;border-bottom:3px solid transparent;}
  .tab.on{color:#111;border-color:var(--y);}
  .body{padding:14px;overflow-y:auto;flex:1;padding-bottom:24px;}
  .card{background:#fff;border-radius:14px;padding:13px;border:1.5px solid var(--line);margin-bottom:10px;}
  .card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .card .oid{font-weight:800;font-size:13px;}
  .badge{font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;background:var(--yl);color:#8a6d00;}
  .badge.pickup{background:#ffe4b8;color:#a35a00;}
  .badge.deliver{background:#d7f0e0;color:#0d7a45;}
  .card .addr{font-size:12px;color:var(--gray);margin:2px 0;}
  .card .cust{font-size:12.5px;font-weight:700;margin-top:4px;}
  .btnrow{display:flex;gap:8px;margin-top:10px;}
  .btn{flex:1;padding:10px;border-radius:10px;border:none;font-weight:800;font-size:12.5px;cursor:pointer;}
  .btn.primary{background:#111;color:var(--y);}
  .btn.ghost{background:var(--yl);color:#8a6d00;}
  .empty{text-align:center;color:var(--gray);padding:40px 10px;font-size:13px;}
  .photobox{width:100%;height:90px;border-radius:10px;background:repeating-linear-gradient(45deg,#f0ede0,#f0ede0 10px,#e8e4d4 10px,#e8e4d4 20px);display:flex;align-items:center;justify-content:center;font-size:26px;margin-top:8px;color:#8a8577;}
  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#111;color:var(--y);padding:10px 18px;border-radius:30px;font-size:12px;font-weight:700;z-index:99;box-shadow:0 6px 18px rgba(0,0,0,.3);display:none;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="role">🚗 DRIVER — Budi Santoso</div>
    <div class="ttl">Tugas Jemput & Antar</div>
  </div>
  <div class="tabs">
    <div class="tab on" data-tab="pickup" onclick="setTab('pickup')">Jemput Baru</div>
    <div class="tab" data-tab="deliver" onclick="setTab('deliver')">Antar Balik</div>
  </div>
  <div class="body" id="list"></div>
</div>
<div class="toast" id="toast"></div>
<script>
let tab = 'pickup';
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',1600); }
function setTab(t){ tab=t; document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('on', el.dataset.tab===t)); renderList(); }
function timeAgo(ts){ const m = Math.floor((Date.now()-ts)/60000); return m<1?'baru saja':m+' menit lalu'; }

function renderList(){
  const el = document.getElementById('list');
  const all = Store.getAll();
  let items = [];
  if(tab==='pickup') items = all.filter(o=>o.status==='menunggu_pickup');
  else items = all.filter(o=>o.status==='siap_kirim');

  if(items.length===0){ el.innerHTML = `<div class="empty">${tab==='pickup'?'Belum ada order baru untuk dijemput':'Belum ada cucian siap diantar'}</div>`; return; }

  el.innerHTML = items.map(o=>{
    if(tab==='pickup'){
      return `<div class="card">
        <div class="top"><div class="oid">#${o.id}</div><div class="badge pickup">Jemput ${timeAgo(o.createdAt)}</div></div>
        <div class="cust">${esc(o.customer)} • ${esc(o.phone)}</div>
        <div class="addr">📦 ${esc(o.pickupAddr)}</div>
        <div class="addr">${esc(o.service)} • ${o.outlet||''}</div>
        <div class="photobox" id="pf-${o.id}">📸 Ambil foto bukti pickup</div>
        <div class="btnrow">
          <button class="btn ghost" onclick="takePhoto('${o.id}','pickup')">📷 Foto Bukti</button>
          <button class="btn primary" onclick="doPickup('${o.id}')">✓ Sudah Dijemput</button>
        </div>
      </div>`;
    }
    return `<div class="card">
      <div class="top"><div class="oid">#${o.id}</div><div class="badge deliver">Siap Diantar</div></div>
      <div class="cust">${esc(o.customer)} • ${esc(o.phone)}</div>
      <div class="addr">🏠 ${esc(o.deliverAddr)}</div>
      <div class="addr">${esc(o.service)} • ${o.outlet||''}</div>
      <div class="photobox" id="pf-${o.id}">📸 Ambil foto bukti antar</div>
      <div class="btnrow">
        <button class="btn ghost" onclick="takePhoto('${o.id}','deliver')">📷 Foto Bukti</button>
        <button class="btn primary" onclick="doDeliver('${o.id}')">✓ Sudah Diantar</button>
      </div>
    </div>`;
  }).join('');
}
function esc(s){ return String(s||'').replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

function takePhoto(id, kind){
  document.getElementById('pf-'+id).textContent = '✅ Foto tersimpan';
  Store.update(id, kind==='pickup' ? {proofPickup:true} : {proofDeliver:true});
  showToast('Foto bukti berhasil diupload');
}
function doPickup(id){
  Store.update(id, {status:'dijemput'});
  showToast('Cucian ditandai sudah dijemput → outlet diberi notifikasi');
  renderList();
}
function doDeliver(id){
  Store.update(id, {status:'selesai'});
  showToast('Pesanan ditandai selesai diantar');
  renderList();
}

Store.seed();
Store.subscribe(()=>renderList());
renderList();
</script>
</body>
</html>
